# /etc/nginx/sites-available/yourdomain.com

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve customer frontend static files
    root /var/www/digitalproductpage/frontend;
    index index.html;

    # Serve admin static files at /admin
    location /admin {
        alias /var/www/digitalproductpage/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # Proxy all /api/* to Node.js backend
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Customer frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRITICAL: Block any direct access to PDF files
    location ~* \.pdf$ {
        deny all;
        return 404;
    }

    # Block .env and hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block access to private directory
    location /private/ {
        deny all;
        return 404;
    }
}
