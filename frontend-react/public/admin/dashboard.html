<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/admin-main.css">
  <link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body>

  <!-- Loading State -->
  <div id="auth-check" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--admin-bg); z-index: 9999; display: flex; align-items: center; justify-content: center;">
    <p>Verifying session...</p>
  </div>

  <div class="dashboard-layout hidden" id="dashboard-main">
    <header class="admin-header">
      <div class="admin-logo">Admin Panel</div>
      <div class="admin-user">
        <span id="current-username">Admin</span>
        <button id="logout-btn" class="btn btn-outline">Logout</button>
      </div>
    </header>

    <main class="admin-content">
      
      <!-- Stats Row -->
      <div class="stats-grid" id="stats-container">
        <!-- Rendered by JS -->
      </div>

      <!-- Filters -->
      <div class="filters-row">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="filter-status" class="form-select">
            <option value="all">All Purchases</option>
            <option value="paid">Paid Only</option>
            <option value="pending">Pending</option>
            <option value="failed">Failed</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label">Search</label>
          <input type="text" id="filter-search" class="form-input" placeholder="Name, email, Order ID...">
        </div>
        
        <div class="form-group">
          <label class="form-label">From Date</label>
          <input type="date" id="filter-date-from" class="form-input">
        </div>
        
        <div class="form-group">
          <label class="form-label">To Date</label>
          <input type="date" id="filter-date-to" class="form-input">
        </div>

        <div class="filters-actions">
          <button id="apply-filters-btn" class="btn btn-primary">Apply</button>
          <button id="export-csv-btn" class="btn btn-outline">Export CSV</button>
        </div>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Customer</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Payment ID</th>
              <th>Downloads</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="purchases-table-body">
            <!-- Rendered by JS -->
          </tbody>
        </table>
        
        <div class="pagination" id="pagination-controls">
          <button id="prev-page" class="btn btn-outline" disabled>&larr; Prev</button>
          <span id="page-info" style="font-size: 13px; color: var(--admin-text-muted);">Page 1 of 1</span>
          <button id="next-page" class="btn btn-outline" disabled>Next &rarr;</button>
        </div>
      </div>

    </main>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="admin-modal-overlay">
    <div class="admin-modal-content">
      <div class="admin-modal-header">
        <h3>Purchase Details</h3>
        <button class="modal-close" id="close-modal-btn" style="background:none; border:none; color:var(--admin-text); cursor:pointer; font-size:20px;">&times;</button>
      </div>
      <div class="admin-modal-body" id="modal-content-area">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script src="js/admin-api.js"></script>
  <script src="js/admin-dashboard.js"></script>
  <script src="js/admin-stats.js"></script>
  <script src="js/admin-table.js"></script>
  <script src="js/admin-export.js"></script>
</body>
</html>
